<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elmienda — Prints &amp; Crafts</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">
  <section class="relative min-h-screen flex flex-col items-center justify-center gap-6 px-6 text-center overflow-hidden">
    <div class="absolute inset-0 -z-10 bg-[radial-gradient(#DCB6FB_1.5px,transparent_1.5px)] [background-size:24px_24px] [mask-image:linear-gradient(to_bottom,black,transparent)] [-webkit-mask-image:linear-gradient(to_bottom,black,transparent)]"></div>
    <img src="logo.svg" alt="Elmienda logo" class="w-96 max-w-full" />
    <p class="text-lg text-gray-600 max-w-md">Handmade prints &amp; crafts, made with love.</p>
    <a href="#" class="rounded-full bg-[#DCB6FB] px-8 py-3 font-medium text-gray-900 hover:opacity-80 transition">Shop Now</a>
  </section>
</body>
</html>
